    - https://www.linkedin.com/in/eoinclayton/

# Google Search Console verification uses the HTML-file method — see
# google948f932aac3b94e8.html at the repo root, not a config key.

# No theme — fully custom layouts/CSS ("instrument panel" design, see _layouts/
# and assets/css/style.scss). Do not re-add a theme; it would override _layouts.

plugins:
  - jekyll-feed
  - jekyll-seo-tag
  - jekyll-sitemap

permalink: /:year/:month/:day/:title/

# Files that are not part of the published site. Setting `exclude` replaces
# Jekyll's default list, so the standard build files are repeated here.
# CLAUDE.md / README.md are tooling docs — without excluding them the
# jekyll-optional-front-matter plugin runs them through Liquid, which chokes on
# the literal {% raw %} examples inside CLAUDE.md. (.claude/ is already ignored
# as a dot-directory.)
exclude:
  - Gemfile
  - Gemfile.lock
  - vendor
  - .sass-cache
  - .jekyll-cache
  - node_modules
  - CLAUDE.md
  - README.md
