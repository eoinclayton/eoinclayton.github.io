---
layout: default
---

<article class="post">
  <header class="post-header">
    <p class="post-eyebrow">
      <span class="post-eyebrow-label">Log entry</span>
      <time datetime="{{ page.date | date_to_xmlschema }}">{{ page.date | date: "%Y-%m-%d" }}</time>
    </p>
    <h1 class="post-title-main">{{ page.title }}</h1>
    <div class="dot-rule" aria-hidden="true"></div>
  </header>

  <div class="prose">
    {{ content }}
  </div>

  <nav class="post-nav">
    {% if page.previous %}
      <a href="{{ page.previous.url | relative_url }}" class="post-nav-link prev">
        <span class="post-nav-dir">← Older</span>
        <span class="post-nav-title">{{ page.previous.title }}</span>
      </a>
    {% else %}
      <span></span>
    {% endif %}
    {% if page.next %}
      <a href="{{ page.next.url | relative_url }}" class="post-nav-link next">
        <span class="post-nav-dir">Newer →</span>
        <span class="post-nav-title">{{ page.next.title }}</span>
      </a>
    {% endif %}
  </nav>
</article>
